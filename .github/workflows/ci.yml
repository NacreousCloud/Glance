name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: src-tauri
      # The macos-14 image ships with a `rustup-init` shim in /usr/local/bin
      # that pre-empts the rustup-managed cargo. Prepend ~/.cargo/bin so
      # subsequent `cargo` / `rustup` invocations resolve to the toolchain
      # the action just installed.
      - name: Prepend cargo bin to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test:run
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features mock-os
      - name: Tauri build (debug)
        run: pnpm tauri build --debug
