name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install Rust toolchain (macOS, clean)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo rm -f /usr/local/bin/rustup-init /opt/homebrew/bin/rustup-init || true
          rm -rf "$HOME/.cargo/bin" || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version
      - name: Install Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test:run
      - name: Rust check
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --manifest-path src-tauri/Cargo.toml --features mock-os
      - name: Tauri build (debug)
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          pnpm tauri build --debug
