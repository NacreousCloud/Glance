name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      # ── Rust toolchain ────────────────────────────────────────────────
      # macOS-14 runners ship with a `rustup-init` shim that hijacks
      # `cargo` and breaks subcommands like `cargo metadata`. Wipe every
      # stale proxy and reinstall rustup from scratch. This is the only
      # configuration that's been stable across runner image refreshes.
      - name: Install Rust toolchain (macOS, clean)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo rm -f /usr/local/bin/rustup-init /opt/homebrew/bin/rustup-init || true
          rm -rf "$HOME/.cargo/bin" || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          # Sanity-check what the next steps will resolve.
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version
      - name: Install Rust toolchain (Windows)
        if: runner.os == 'Windows'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - run: pnpm install --frozen-lockfile
      - name: Build + upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
