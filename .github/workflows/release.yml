name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Required so softprops/action-gh-release can create the GitHub release
  # and upload the DMG / MSI artifacts.
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: src-tauri
      - name: Prepend cargo bin to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: pnpm install --frozen-lockfile
      # Builds unsigned bundles. The previous setup unconditionally
      # exported empty APPLE_CERTIFICATE / signing secrets which caused
      # the macOS bundler to attempt (and fail) a `security import`. Add
      # the env block back, gated behind a real secret, once
      # notarization is set up.
      - name: Build Tauri bundle
        run: pnpm tauri build
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
